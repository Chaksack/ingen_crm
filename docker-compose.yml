name: ingencore
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ingencore
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      # A separate, unprivileged role for RLS to actually apply — the
      # bootstrap POSTGRES_USER above is a superuser, and RLS never applies
      # to superusers/BYPASSRLS roles regardless of FORCE ROW LEVEL SECURITY.
      # See db/migrations/0006_row_level_security.sql.
      DATABASE_URL: postgresql://app_role:apppassword@db:5432/ingencore?sslmode=disable
      API_PORT: "8080"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      PUSH_CONTACT: ${PUSH_CONTACT}
    depends_on:
      - db
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - vendor/
            - bin/
        - action: rebuild
          path: ./apps/api/go.mod
        - action: rebuild
          path: ./apps/api/go.sum

volumes:
  db_data:
